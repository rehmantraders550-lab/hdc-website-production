  - from: HDC-UX-0003
    type: shares_architecture_without_forcing_behavior
    to: [finishing_embellishment_register, quality_register]

collision_rules:
  - id: COLL-0001
    condition: historical_record_conflicts_with_current_main
    resolution: preserve historical record, mark superseded, current main wins
  - id: COLL-0002
    condition: visual_ambition_conflicts_with_material_truth
    resolution: material/process truth wins
  - id: COLL-0003
    condition: interaction_novelty_conflicts_with_accessibility_or_mobile
    resolution: accessibility/mobile continuity wins
  - id: COLL-0004
    condition: deployment_success_conflicts_with_live_route_evidence
    resolution: live route evidence wins; deployment remains incomplete
  - id: COLL-0005
    condition: duplicate_source_text_detected
    resolution: preserve both source identities, normalize one canonical atom, retain all provenance links
  - id: COLL-0006
    condition: uncertain_surface_capability
    resolution: route to testing/review; do not promote to production-approved claim

supersession_rules:
  - Never delete a superseded atom.
  - New knowledge should point to the atom it supersedes.
  - A historical atom remains valid for its original temporal scope.
  - Canonical projections should include only ACTIVE atoms unless historical context is explicitly useful.
