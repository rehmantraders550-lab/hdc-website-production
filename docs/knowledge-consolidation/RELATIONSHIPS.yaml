  - from: HDC-VIS-0001
    type: supersedes_or_constrains
    to: [HDC-HIST-0002]
  - from: HDC-UX-0005
    type: supersedes_or_constrains
    to: [HDC-HIST-0002]
  - from: HDC-HIST-0003
    type: explains_temporal_transition
    to: [HDC-UX-0001, HDC-UX-0002, HDC-UX-0003, HDC-UX-0005, HDC-UX-0006]
  - from: HDC-WF-0001
    type: constrained_by
    to: [HDC-GOV-0004, HDC-WF-0003]
  - from: HDC-WF-0002
    type: failure_recovery_for
    to: [HDC-WF-0001]
  - from: HDC-DEP-0001
    type: constrained_by
    to: [HDC-GOV-0004]
  - from: HDC-DEP-0002
    type: validates
