known_duplicate_evidence:
  - HDC_NEXT_PHASE_HANDOFF_2026-09-16.md
  - HDC_NEXT_PHASE_HANDOFF_2026-09-16(1).md
  - HDC_Validated_Website_Construction_Handoff_v1.md
  - HDC_Validated_Website_Construction_Handoff_v1(1).md
  handling: Preserve both originals if present; normalize to one semantic evidence set.

coverage_limits:
  - Historical ChatGPT conversation text has not been exhaustively exported line-by-line into this repository.
  - Any later-discovered HDC file or chat record must enter SOURCE_REGISTRY and this ledger before canonical promotion.
  - Visual meaning contained only inside an image is not considered fully captured by filename or alt text; original binary remains authoritative.
  - Current live-domain state may change after this baseline and requires revalidation against the then-current main SHA.

audit_gates:
  source_registry_present: true
  baseline_sha_recorded: true
  tree_sha_recorded: true
  authority_model_present: true
  historical_supersession_preserved: true
  binary_preservation_rule_present: true
  contradiction_rule_present: true
  silent_skip_allowed: false
