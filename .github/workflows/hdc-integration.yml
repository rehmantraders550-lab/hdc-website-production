name: HDC Integration Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, hdc-integration-automation, 'hdc-media-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hdc-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site and assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image validation dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Validate local references, IDs and asset integrity
        run: python scripts/validate_site.py

      - name: Set up Node.js for Wrangler validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pinned Wrangler CLI
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate Worker Static Assets config without deploying
        run: npm run deploy -- --dry-run

      - name: Record validated commit
        run: |
          echo "validated_sha=${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"

  worker-smoke:
    name: Verify Cloudflare candidate render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    env:
      WORKER_URL: https://hdc-website-production.rehmantraders550.workers.dev
    steps:
      - name: Record candidate URL
        run: echo "candidate_url=$WORKER_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Allow Cloudflare Git build to finish
        run: sleep 90

      - name: Smoke test homepage
        run: |
          set -euo pipefail
          code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/hdc-home.html -w '%{http_code}' --retry 3 --retry-delay 5 "$WORKER_URL")"
          test "$code" = "200"
          grep -qi "Hadi Digital Craft" /tmp/hdc-home.html
          echo "homepage_http=$code" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test promoted static site assets
        run: |
          set -euo pipefail
          base="${WORKER_URL%/}"
          grep -qi "Hadi Digital Craft" /tmp/hdc-home.html
          grep -qi "Print, engineered to be felt" /tmp/hdc-home.html
          if grep -qi "PRIVATE DEVELOPMENT PREVIEW" /tmp/hdc-home.html; then
            echo "Staging banner still appears on the production homepage"
            exit 1
          fi

          site_dir="previews/engineered-tactility-2026-10-07"
          while IFS= read -r file
          do
            rel="${file#"$site_dir"/}"
            if [ "$rel" = "_redirects" ]; then
              continue
            fi
            code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/hdc-asset -w '%{http_code}' --retry 2 --retry-delay 5 "$base/$rel")"
            echo "$rel -> $code"
            test "$code" = "200"
            test -s /tmp/hdc-asset
          done < <(find "$site_dir" -type f | sort)

          for path in about.html applications.html contact.html faq.html finishing-embellishment.html glass-surface-decoration.html labels-decals.html large-format-brand-environments.html packaging-commercial-print.html production.html products-object-printing.html request-a-quote.html selected-work.html services.html surface-lab.html
          do
            code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o /tmp/hdc-page.html -w '%{http_code}' --retry 2 --retry-delay 5 "$base/$path")"
            echo "$path -> $code"
            test "$code" = "200"
            grep -qi "<html" /tmp/hdc-page.html
            grep -qi "<h1" /tmp/hdc-page.html
            test -s /tmp/hdc-page.html
          done

          for path in hdc-expanding-panels-lab.html machine-dtf.html machine-large-format.html machine-offset.html machine-uv-dtf.html machine-uv-flatbed.html previews/engineered-tactility-2026-10-07/
          do
            code="$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$base/$path")"
            echo "$path -> $code"
            test "$code" = "301"
          done
          echo "promoted_assets=PASSED" >> "$GITHUB_STEP_SUMMARY"
          echo "legacy_redirects=PASSED" >> "$GITHUB_STEP_SUMMARY"
