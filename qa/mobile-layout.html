<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HDC responsive verification</title><style>body{margin:0;font:16px/1.5 Arial;background:#e7e9eb;color:#111}header{padding:12px 24px;background:white}h1{font-size:20px;margin:0}a,button,select{font:inherit;margin-right:12px;min-height:44px}#stage{width:max-content;margin:20px auto}iframe{display:block;border:0;background:white;box-shadow:0 3px 22px #0003}pre{white-space:pre-wrap;font:13px/1.5 monospace;padding:16px;margin:16px auto;max-width:1100px}#summary{padding:0 24px;font-weight:bold}</style></head><body><header><h1>HDC responsive verification — isolated QA branch</h1><p>Tests the same site files as the review branch. No customer data is submitted.</p><label>Viewport <select id="width"><option>320</option><option selected>390</option><option>430</option><option>480</option><option>768</option><option>900</option><option>1240</option></select></label><label>Page <select id="route"></select></label><button id="open">Open page</button><button id="audit">Audit all mobile routes</button><button id="interactions">Check homepage controls</button><button id="recheck">Recheck changed pages</button><a id="baseline" href="?route=qa/baseline-home.html&width=390">Original homepage</a></header><p id="summary">Opening selected page…</p><div id="stage"><iframe id="phone" title="HDC page at the selected viewport width"></iframe></div><pre id="results" aria-live="polite"></pre><script>
const routes=['index.html','services.html','labels-decals.html','products-object-printing.html','packaging-commercial-print.html','large-format-brand-environments.html','finishing-embellishment.html','surface-lab.html','production.html','machine-uv-flatbed.html','machine-uv-dtf.html','machine-offset.html','machine-large-format.html','glass-surface-decoration.html','applications.html','industries.html','about.html','contact.html','request-a-quote.html','faq.html','selected-work.html'];
const frame=document.querySelector('#phone'),out=document.querySelector('#results'),summary=document.querySelector('#summary');
const params=new URLSearchParams(location.search);document.querySelector('#width').value=params.get('width')||'390';
for(const r of [...routes,'qa/baseline-home.html']){const o=new Option(r,r);document.querySelector('#route').add(o)}document.querySelector('#route').value=params.get('route')||'index.html';
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function load(route,width){frame.width=width;frame.height=844;await new Promise(resolve=>{frame.onload=resolve;frame.src='/'+route});await frame.contentDocument.fonts.ready;await delay(250);return frame.contentDocument}
function visible(e){const s=e.ownerDocument.defaultView.getComputedStyle(e),r=e.getBoundingClientRect();return r.width>0&&r.height>0&&s.visibility!=='hidden'&&s.display!=='none'}
function audit(doc,route,width){const win=doc.defaultView,availableWidth=doc.documentElement.clientWidth;const all=[...doc.querySelectorAll('body *')].filter(visible);const overflow=all.filter(e=>{const r=e.getBoundingClientRect();if(r.right<=availableWidth+1&&r.left>=-1)return false;let p=e.parentElement;while(p&&p!==doc.body){const s=win.getComputedStyle(p);if(/auto|scroll|hidden|clip/.test(s.overflowX))return false;p=p.parentElement}return true}).slice(0,8).map(e=>({el:e.tagName+'.'+e.className,right:Math.round(e.getBoundingClientRect().right),width:Math.round(e.getBoundingClientRect().width)}));const controls=[...doc.querySelectorAll('button,.button,.text-link,.nav-cta,input:not([type=checkbox]):not([type=radio]),textarea,select')].filter(visible);const small=controls.filter(e=>{const r=e.getBoundingClientRect();return r.height<47||r.width<43}).slice(0,8).map(e=>({el:e.tagName+'.'+e.className,label:(e.textContent||e.getAttribute('aria-label')||'').trim().slice(0,55),w:Math.round(e.getBoundingClientRect().width),h:Math.round(e.getBoundingClientRect().height)}));return{route,width,pageWidth:doc.documentElement.scrollWidth,availableWidth,overflow,smallControls:small,loadedStyles:!!doc.querySelector('link[href*="hdc-mobile-readability"]'),bodyFont:win.getComputedStyle(doc.body).fontSize}}
async function openPage(){const route=document.querySelector('#route').value,width=Number(document.querySelector('#width').value),doc=await load(route,width);const a=audit(doc,route,width);summary.textContent=`${route} — ${width}px viewport / ${a.pageWidth}px page`;out.textContent=JSON.stringify(a,null,2)}
document.querySelector('#open').onclick=openPage;
document.querySelector('#audit').onclick=async()=>{out.textContent='';const rows=[];for(const width of [320,390,430,480,768,900])for(const route of routes){summary.textContent=`Checking ${route} at ${width}px…`;const doc=await load(route,width);rows.push(audit(doc,route,width))}out.textContent=JSON.stringify(rows,null,2);summary.textContent=`${rows.length} checks complete; ${rows.filter(r=>r.pageWidth>r.availableWidth+1||r.overflow.length).length} width failures; ${rows.filter(r=>r.smallControls.length).length} pages with undersized controls.`;window.qaResults=rows;await load('index.html',390)};
document.querySelector('#recheck').onclick=async()=>{const rows=[];for(const width of [320,390,430,480,768,900,1240])for(const route of ['index.html','production.html','surface-lab.html','request-a-quote.html']){summary.textContent=`Rechecking ${route} at ${width}px…`;rows.push(audit(await load(route,width),route,width))}out.textContent=JSON.stringify(rows,null,2);summary.textContent=`${rows.length} checks complete; ${rows.filter(r=>r.pageWidth>r.availableWidth+1||r.overflow.length).length} width failures; ${rows.filter(r=>r.smallControls.length).length} pages with undersized controls.`;await load('index.html',430)};document.querySelector('#interactions').onclick=async()=>{const doc=await load('index.html',390),checks=[];const menu=doc.querySelector('.menu-toggle');menu.click();checks.push({check:'Menu opens',passed:menu.getAttribute('aria-expanded')==='true'});menu.click();checks.push({check:'Menu closes',passed:menu.getAttribute('aria-expanded')==='false'});const search=doc.querySelector('#product-search');search.value='Certificates';search.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));checks.push({check:'Search returns certificate',passed:doc.querySelectorAll('.product-card').length===1});search.value='';search.dispatchEvent(new frame.contentWindow.Event('input',{bubbles:true}));checks.push({check:'Search restores 12 products',passed:doc.querySelectorAll('.product-card').length===12});doc.querySelector('.product-card-trigger').click();const dialog=doc.querySelector('#product-dialog');checks.push({check:'Product dialog opens',passed:dialog.open});checks.push({check:'Close control is at least 48px',passed:dialog.querySelector('.dialog-close').getBoundingClientRect().height>=48});dialog.querySelector('[data-close-product]').click();checks.push({check:'Product dialog closes',passed:!dialog.open});const foil=doc.querySelector('[data-finish="foil"]');foil.click();checks.push({check:'Finishing tab changes',passed:foil.getAttribute('aria-selected')==='true'&&doc.querySelector('#finish-detail').textContent.includes('Foil')});const trigger=doc.querySelectorAll('.service-trigger')[1];trigger.click();checks.push({check:'Service panel changes',passed:trigger.getAttribute('aria-expanded')==='true'});summary.textContent=checks.every(c=>c.passed)?'All homepage interaction checks passed.':'Interaction failure found.';out.textContent=JSON.stringify(checks,null,2)};
openPage();
</script></body></html>
